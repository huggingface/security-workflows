# add comment
---
name: Reusable Octoscan Workflow Security Analysis

on:
  workflow_call:
    inputs:
      target:
        description: 'Target directory to scan'
        required: false
        type: string
        default: '.github/workflows'
      disable_rules:
        description: 'Rules to disable (comma-separated)'
        required: false
        type: string
        default: 'shellcheck,local-action,runner-label'
      filter_triggers:
        description: 'Filter by trigger type (external, allnopr, or empty for all)'
        required: false
        type: string
        default: ''
      generate_summary:
        description: 'Generate detailed summary'
        required: false
        type: boolean
        default: true


permissions: {}

jobs:
  octoscan:
    permissions:
      actions: read
      contents: read
      security-events: write
    name: Scan Workflows
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Run Octoscan
        id: octoscan
        uses: synacktiv/action-octoscan@6b1cf2343893dfb9e5f75652388bd2dc83f456b0 # v1.0.0
        with:
          disable_rules: ${{ inputs.disable_rules }}
          filter_triggers: ${{ inputs.filter_triggers }}
      
      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: "${{ steps.octoscan.outputs.sarif_output }}"
          category: octoscan
      
      - name: Upload results artifact
        if: always() && inputs.generate_summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octoscan-results
          path: results.json
          retention-days: 30
          if-no-files-found: ignore
